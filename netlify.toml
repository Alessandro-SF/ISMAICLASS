[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless auth API (netlify/functions/auth.mjs is served at /api/auth/*).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: send every other route to index.html so deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
